<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0L9,4.5L0,9Z" fill="#5b718c"/></marker></defs><style>text{font-family:Arial,"Microsoft YaHei",sans-serif}</style><rect width="1600" height="900" rx="20" fill="#fff"/><text x="60" y="60" font-size="34" fill="#263d58" text-anchor="start">Wan Restore Fast · 先恢复，再自适应细化</text><text x="60" y="100" font-size="22" fill="#75859b" text-anchor="start">β = 2.0 · τ = 0.010 · 一个 prompt · 外部原版 Wan2.1 T2V-1.3B</text><rect x="60" y="160" width="210" height="120" rx="13" fill="#edf3fa" stroke="#b6c7d9" stroke-width="2"/><text x="165.0" y="200" font-size="25" fill="#263d58" text-anchor="middle">Prompt</text><text x="165.0" y="234" font-size="19" fill="#52677e" text-anchor="middle">T5 文字编码</text><text x="165.0" y="261" font-size="19" fill="#52677e" text-anchor="middle">自动词组对应</text><rect x="335" y="160" width="260" height="120" rx="13" fill="#edf3fa" stroke="#b6c7d9" stroke-width="2"/><text x="465.0" y="200" font-size="25" fill="#263d58" text-anchor="middle">原版 Wan · 1—10步</text><text x="465.0" y="234" font-size="19" fill="#52677e" text-anchor="middle">完整 token / CFG</text><text x="465.0" y="261" font-size="19" fill="#52677e" text-anchor="middle">z10 + 真实含噪状态</text><rect x="660" y="160" width="245" height="120" rx="13" fill="#e9f4ed" stroke="#b6c7d9" stroke-width="2"/><text x="782.5" y="200" font-size="25" fill="#263d58" text-anchor="middle">F/H 提取器</text><text x="782.5" y="234" font-size="19" fill="#52677e" text-anchor="middle">输入 z10 · 16C</text><text x="782.5" y="261" font-size="19" fill="#52677e" text-anchor="middle">输出 F46C + H1C</text><rect x="970" y="160" width="290" height="120" rx="13" fill="#e9f4ed" stroke="#b6c7d9" stroke-width="2"/><text x="1115.0" y="200" font-size="25" fill="#263d58" text-anchor="middle">恢复网络</text><text x="1115.0" y="234" font-size="19" fill="#52677e" text-anchor="middle">输入 z10 / F / H</text><text x="1115.0" y="261" font-size="19" fill="#52677e" text-anchor="middle">恢复端点 R + C / e / u</text><polyline points="270,220 335,220" fill="none" stroke="#5b718c" stroke-width="2.5" marker-end="url(#a)"/><polyline points="595,220 660,220" fill="none" stroke="#5b718c" stroke-width="2.5" marker-end="url(#a)"/><polyline points="905,220 970,220" fill="none" stroke="#5b718c" stroke-width="2.5" marker-end="url(#a)"/><rect x="335" y="355" width="315" height="135" rx="13" fill="#f3eef8" stroke="#b6c7d9" stroke-width="2"/><text x="492.5" y="395" font-size="25" fill="#263d58" text-anchor="middle">自动主体定位</text><text x="492.5" y="429" font-size="19" fill="#52677e" text-anchor="middle">已有 latent 主体概率</text><text x="492.5" y="456" font-size="19" fill="#52677e" text-anchor="middle">与 prompt 空间响应相互对应</text><text x="492.5" y="483" font-size="19" fill="#52677e" text-anchor="middle">无需手动类别 / mask</text><polyline points="465,280 465,355" fill="none" stroke="#5b718c" stroke-width="2.5" marker-end="url(#a)"/><polyline points="782,280 782,315 620,315 620,355" fill="none" stroke="#5b718c" stroke-width="2.5" marker-end="url(#a)"/><rect x="745" y="355" width="515" height="135" rx="13" fill="#fff2e5" stroke="#b6c7d9" stroke-width="2"/><text x="1002.5" y="395" font-size="25" fill="#263d58" text-anchor="middle">互斥区域 · 恢复误差自适应选区</text><text x="1002.5" y="429" font-size="19" fill="#52677e" text-anchor="middle">S：主体细化 · L：低置信度细化</text><text x="1002.5" y="456" font-size="19" fill="#52677e" text-anchor="middle">R 区：纯恢复（Wan 刷新次数为 0）</text><text x="1002.5" y="483" font-size="19" fill="#52677e" text-anchor="middle">局部阈值参考恢复误差、细节、变化量</text><polyline points="650,423 745,423" fill="none" stroke="#5b718c" stroke-width="2.5" marker-end="url(#a)"/><polyline points="1115,280 1115,355" fill="none" stroke="#5b718c" stroke-width="2.5" marker-end="url(#a)"/><rect x="60" y="585" width="420" height="185" rx="13" fill="#fff2e5" stroke="#b6c7d9" stroke-width="2"/><text x="270.0" y="625" font-size="25" fill="#263d58" text-anchor="middle">恢复相对刷新需求 · 每步 check</text><text x="270.0" y="659" font-size="19" fill="#52677e" text-anchor="middle">实际 Wan 修正 d = clean − R</text><text x="270.0" y="686" font-size="19" fill="#52677e" text-anchor="middle">修正创新量 / 稳定证据 / 邻域反馈</text><text x="270.0" y="713" font-size="19" fill="#52677e" text-anchor="middle">主体概率与细节决定重要性</text><text x="270.0" y="740" font-size="19" fill="#52677e" text-anchor="middle">需求超过 β 则刷新，无固定档位</text><rect x="560" y="585" width="420" height="185" rx="13" fill="#edf3fa" stroke="#b6c7d9" stroke-width="2"/><text x="770.0" y="625" font-size="25" fill="#263d58" text-anchor="middle">Wan · 11—50步自适应细化</text><text x="770.0" y="659" font-size="19" fill="#52677e" text-anchor="middle">选中 token：30层完整计算</text><text x="770.0" y="686" font-size="19" fill="#52677e" text-anchor="middle">跳过 token：自己的真实历史积分</text><text x="770.0" y="713" font-size="19" fill="#52677e" text-anchor="middle">Step50 刷新全部细化候选</text><text x="770.0" y="740" font-size="19" fill="#52677e" text-anchor="middle">Q/K/V 参照 + 实测残差融合算子</text><rect x="1080" y="600" width="440" height="155" rx="13" fill="#e9f4ed" stroke="#b6c7d9" stroke-width="2"/><text x="1300.0" y="640" font-size="25" fill="#263d58" text-anchor="middle">三种权重组装 → 最终 VAE</text><text x="1300.0" y="674" font-size="19" fill="#52677e" text-anchor="middle">S / L / R 权重互斥，总和 = 1</text><text x="1300.0" y="701" font-size="19" fill="#52677e" text-anchor="middle">最终 41 帧视频 · 不加额外尾部</text><text x="1300.0" y="728" font-size="19" fill="#52677e" text-anchor="middle">在线无图像预览解码</text><polyline points="875,490 875,535 270,535 270,585" fill="none" stroke="#5b718c" stroke-width="2.5" marker-end="url(#a)"/><polyline points="480,680 560,680" fill="none" stroke="#5b718c" stroke-width="2.5" marker-end="url(#a)"/><polyline points="980,680 1080,680" fill="none" stroke="#5b718c" stroke-width="2.5" marker-end="url(#a)"/><polyline points="765,770 765,815 270,815 270,770" fill="none" stroke="#5b718c" stroke-width="2.5" marker-end="url(#a)"/><text x="510" y="851" font-size="20" fill="#75859b" text-anchor="middle">只用实际新观测更新修正证据</text><polyline points="1260,220 1460,220 1460,535 945,535 945,585" fill="none" stroke="#5b718c" stroke-width="2.5" marker-end="url(#a)"/><text x="1390" y="335" font-size="21" fill="#263d58" text-anchor="middle">固定恢复端点 R</text><text x="1390" y="368" font-size="20" fill="#263d58" text-anchor="middle">捕获 K/V 参照</text><text x="1390" y="401" font-size="20" fill="#263d58" text-anchor="middle">一次额外观察</text><text x="1390" y="434" font-size="20" fill="#263d58" text-anchor="middle">耗时计入在线</text></svg>